spring.application.name=gamer-backend

# Toutes les urls commencent par /gamers  ->  http://localhost:8080/gamers/...
server.servlet.context-path=/gamers
server.port=8080

# Base de donnees MySQL (XAMPP : utilisateur root, mot de passe vide)
spring.datasource.url=jdbc:mysql://localhost:3306/gamer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate cree / met a jour les tables tout seul
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
